# Local setup with a SEPARATE Qdrant server (like a real company setup).
#   docker compose up --build
#   open http://localhost:8000      Qdrant dashboard: http://localhost:6333/dashboard
services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333   # talk to the qdrant service above
    ports:
      - "8000:7860"
    volumes:
      - app_storage:/app/storage       # chunks.jsonl survives restarts
    depends_on:
      - qdrant

volumes:
  qdrant_data:
  app_storage:
